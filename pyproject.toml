[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-pipeline"
version = "0.1.0"
description = "Invoice processing pipeline: Ingestion, Validation, Approval, Payment"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11",
    "pydantic>=2.12",
    "rich>=14",
]

[project.optional-dependencies]
tui = ["textual==8.2.8"]  # `python main.py tui`; batch and `review --list` never need it
dev = ["pytest>=8", "ruff>=0.8"]
all = ["invoice-pipeline[tui,dev]"]  # full install: pip install -e ".[all]"

[tool.setuptools.packages.find]
where = ["."]
include = ["invoice_pipeline*"]
namespaces = false

[tool.setuptools.package-data]
invoice_pipeline = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: needs a live Grok endpoint (XAI_API_KEY, GROK_BASE_URL); skipped without configuration",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["openspec", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
